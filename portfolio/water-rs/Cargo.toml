[package]
name = "water-rs"
version = "0.1.0"
edition = "2021"
description = "The river's height field: a 2D wave equation, compiled to WebAssembly."

[lib]
# cdylib is the .wasm the game loads; rlib lets `cargo test` link the same code
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
